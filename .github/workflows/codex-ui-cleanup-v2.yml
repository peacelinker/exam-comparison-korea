name: Apply worship UI cleanup and deploy v2

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codex-ui-cleanup-v2.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: codex-ui-cleanup-v2
