name: Apply Codex update and deploy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/codex-deploy-update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update_and_deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
